<script>
const S=[...document.querySelectorAll('.s')];let cur=0;
const go=i=>{cur=Math.max(0,Math.min(S.length-1,i));S[cur].scrollIntoView({behavior:'smooth'})};
document.getElementById('p').onclick=()=>go(cur-1);document.getElementById('n').onclick=()=>go(cur+1);
addEventListener('keydown',e=>{if(['ArrowDown','ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(cur+1)}if(['ArrowUp','ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}});
new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){cur=S.indexOf(e.target);document.getElementById('c').textContent=(cur+1)+' / '+S.length}}),{threshold:.6}).observe;
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){cur=S.indexOf(e.target);document.getElementById('c').textContent=(cur+1)+' / '+S.length}}),{threshold:.6});S.forEach(s=>io.observe(s));
</script></body></html>
